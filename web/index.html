  <script>

      var cleanupKey = 'grj-bootstrap-cleanup-' + bootstrapVersion;

      function loadFlutter() {

      async function cleanupLegacyClientState() {

          var registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(function (registration) {
            return registration.unregister().catch(function () {

            });
          }));
        }

        if ('caches' in window) {
          var cacheKeys = await caches.keys();
          await Promise.all(cacheKeys.map(function (cacheKey) {
            return caches.delete(cacheKey).catch(function () {
              return false;
            });
          }));
        }
      }

      async function start() {
        try {
          if (window.localStorage && localStorage.getItem(cleanupKey) === 'done') {
            loadFlutter();
            return;
          }

          await cleanupLegacyClientState();

          if (window.localStorage) {
            localStorage.setItem(cleanupKey, 'done');
          }
        } catch (error) {
          console.warn('Bootstrap cleanup failed.', error);
        }

        loadFlutter();
      }

      start();
    })();
