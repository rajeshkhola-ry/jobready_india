name: Deploy to Render

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  trigger-render:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Render deployment via deploy hook"
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "RENDER_DEPLOY_HOOK_URL secret is not configured."
            echo "Set GitHub secret RENDER_DEPLOY_HOOK_URL to the Render service deploy hook URL."
            exit 1
          fi

      - name: Verify Render health endpoint
        run: |
          HEALTH_URL="https://jobready-india.onrender.com/api/info"

          echo "Checking Render health at: $HEALTH_URL"
          for i in {1..12}; do
            STATUS=$(curl -sS -o /tmp/render-health.txt -w "%{http_code}" "$HEALTH_URL" || true)
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Render health check passed."
              exit 0
            fi
            sleep 10
          done

          echo "Render health check failed after retries."
          echo "Last response body:"
          cat /tmp/render-health.txt || true
          exit 1
