name: Deploy to Render

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  trigger-render:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Render deployment via deploy hook"
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "RENDER_DEPLOY_HOOK_URL secret is not configured."
            echo "Render auto-deploy is enabled for the connected service, so this workflow will skip the manual hook step."
          fi
