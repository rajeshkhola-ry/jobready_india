version: '3.9'

services:
  compression-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobready-compression
    ports:
      - "3000:3000"
    volumes:
      - compression_uploads:/app/temp_uploads
      - compression_logs:/app/logs
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/info', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  compression_uploads:
    driver: local
  compression_logs:
    driver: local
