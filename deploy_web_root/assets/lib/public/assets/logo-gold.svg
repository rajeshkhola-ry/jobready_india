<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GET READY JOB Lufthansa yellow moon-glow G logo">
  <defs>
    <radialGradient id="night" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(170 142) rotate(45) scale(430)">
      <stop offset="0" stop-color="#1A2A47"/>
      <stop offset="1" stop-color="#0B1628"/>
    </radialGradient>
    <filter id="moonGlow" x="20" y="20" width="472" height="472" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.9647 0 0 0 0 0.7451 0 0 0 0 0 0 0 0 0.85 0"/>
      <feBlend in="SourceGraphic" mode="normal"/>
    </filter>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#night)"/>

  <g filter="url(#moonGlow)">
    <circle cx="256" cy="256" r="152" stroke="#F6BE00" stroke-width="56"/>
    <path d="M348 256H256" stroke="#F6BE00" stroke-width="56" stroke-linecap="round"/>
    <path d="M306 256V316" stroke="#F6BE00" stroke-width="56" stroke-linecap="round"/>
  </g>

  <circle cx="383" cy="130" r="9" fill="#F6BE00" opacity="0.9"/>
</svg>
